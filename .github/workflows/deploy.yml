name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      # postinstall downloads the tesseract worker/core and traineddata into public/
      - run: npm ci
      - run: npm test
      # the test link repo (duckfix-v2) builds with its own base path, name and storage namespace
      - run: npm run build
        env:
          VITE_BASE: ${{ github.repository == 'BuilderHutLabs/duckfix-v2' && '/duckfix-v2/' || '' }}
          VITE_APP_NAME: ${{ github.repository == 'BuilderHutLabs/duckfix-v2' && 'DuckFix V2' || '' }}
          VITE_STORAGE_NS: ${{ github.repository == 'BuilderHutLabs/duckfix-v2' && 'duckfix-v2' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
